<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Animation Preview</title>
	<style>
		html, body {
			margin: 0;
			min-height: 100%;
			background: #111;
			color: #ddd;
			font-family: system-ui, sans-serif;
		}
		body {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 20px;
			padding: 24px 0 48px;
		}
		h1 {
			font-size: 18px;
			font-weight: 600;
			margin: 0;
		}
		#canvas {
			image-rendering: pixelated;
			width: 512px;
			height: 512px;
			background: #000;
			border: 1px solid #333;
		}
		.panel {
			display: flex;
			flex-direction: column;
			gap: 22px;
			width: 512px;
			padding: 18px 20px;
			background: #1a1a1a;
			border: 1px solid #333;
			border-radius: 8px;
		}
		.row {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}
		.row > label {
			font-size: 13px;
			font-weight: 600;
			color: #bbb;
		}
		select {
			background: #222;
			color: #ddd;
			border: 1px solid #444;
			border-radius: 4px;
			padding: 6px 8px;
			font-size: 14px;
		}
		input[type="range"] {
			width: 100%;
			margin: 0;
			direction: rtl;
			-webkit-appearance: none;
			appearance: none;
			background: transparent;
		}
		input[type="range"]:focus { outline: none; }
		input[type="range"]::-webkit-slider-runnable-track {
			height: 4px;
			background: #444;
			border-radius: 2px;
		}
		input[type="range"]::-moz-range-track {
			height: 4px;
			background: #444;
			border-radius: 2px;
		}
		input[type="range"]::-webkit-slider-thumb {
			-webkit-appearance: none;
			appearance: none;
			width: 16px;
			height: 16px;
			margin-top: -6px;
			border-radius: 50%;
			background: #6cf;
			cursor: pointer;
		}
		input[type="range"]::-moz-range-thumb {
			width: 16px;
			height: 16px;
			border: none;
			border-radius: 50%;
			background: #6cf;
			cursor: pointer;
		}
		/* The thumb centre travels inset by half its width (8px) at each end,
		   so the tick track is inset to match and ticks are absolutely placed. */
		.ticks {
			position: relative;
			height: 14px;
			margin: 0 8px;
		}
		.ticks span {
			position: absolute;
			transform: translateX(-50%);
			font-size: 11px;
			color: #888;
			font-family: ui-monospace, monospace;
			white-space: nowrap;
		}
		.ticks span.end { color: #bbb; }
		.readout {
			font-size: 12px;
			color: #6cf;
			font-family: ui-monospace, monospace;
		}
		.hint {
			font-size: 13px;
			color: #AAA;
			text-align: center;
		}
		kbd {
			background: #222;
			border: 1px solid #444;
			border-radius: 3px;
			padding: 1px 5px;
			font-family: ui-monospace, monospace;
		}
		#dropzone {
			position: fixed;
			inset: 0;
			display: none;
			align-items: center;
			justify-content: center;
			background: rgba(0, 0, 0, 0.8);
			border: 3px dashed #6cf;
			color: #6cf;
			font-size: 22px;
			z-index: 10;
			pointer-events: none;
		}
		#dropzone.active { display: flex; }
	</style>
</head>
<body>
	<h1>Animation Preview</h1>
	<canvas id="canvas"></canvas>

	<div class="panel">
		<div class="row">
			<label for="character-select">Character</label>
			<select id="character-select"></select>
		</div>

		<div class="row">
			<label for="animation-select">Animation</label>
			<select id="animation-select">
				<option value="0">WASD Control Mode</option>
				<option value="1">Walk Up</option>
				<option value="2">Walk Right</option>
				<option value="3">Walk Down</option>
				<option value="4">Walk Left</option>
				<option value="5">Death Animation</option>
			</select>
			<div class="hint" id="space-bar-animation-hint" style="display:none;">
				Press the space bar to trigger death animation
			</div>
		</div>

		<div class="row">
			<label for="speed-slider">Animation speed</label>
			<div class="ticks">
				<span class="end" style="left:0%">6</span>
				<span style="left:20%">5</span>
				<span style="left:40%">4</span>
				<span style="left:60%">3</span>
				<span style="left:80%">2</span>
				<span class="end" style="left:100%">1</span>
			</div>
			<input type="range" id="speed-slider" min="1" max="6" step="1" value="4">
			<div class="ticks">
				<span class="end" style="left:0%">10</span>
				<span style="left:20%">12</span>
				<span style="left:40%">15</span>
				<span style="left:60%">20</span>
				<span style="left:80%">30</span>
				<span class="end" style="left:100%">60</span>
			</div>
			<div class="readout" id="speed-readout"></div>
		</div>

		<div class="hint">
			Drag a PNG spriteset onto the page to hot-reload it.
		</div>

	</div>

	<div id="dropzone">Drop a spriteset PNG to preview it</div>

	<script>
		const speedSlider = document.getElementById('speed-slider');
		const characterSelect = document.getElementById('character-select');
		const animationSelect = document.getElementById('animation-select');
		const spaceBarHint = document.getElementById('space-bar-animation-hint');

		window.onSpritesetLoaded = function (count) {
			const previous = parseInt(characterSelect.value || '0', 10);
			characterSelect.innerHTML = '';
			for (let i = 0; i < count; i++) {
				const option = document.createElement('option');
				option.value = i;
				option.textContent = 'Character ' + i;
				characterSelect.appendChild(option);
			}
			const index = (previous >= 0 && previous < count) ? previous : 0;
			characterSelect.value = index;
			if (typeof Module !== 'undefined' && Module._SetCharacterIndex) {
				Module._SetCharacterIndex(index);
			}
			applySpeed();
			setAnimationMode();
		};

		function applySpeed() {
			const frameDelay = parseInt(speedSlider.value, 10);
			const fps = Math.round(60 / frameDelay);
			document.getElementById('speed-readout').textContent =
				'frame delay ' + frameDelay + '  ·  ' + fps + ' FPS';
			if (typeof Module !== 'undefined' && Module._SetAnimationSpeed) {
				Module._SetAnimationSpeed(frameDelay);
			}
		}

		function setAnimationMode() {
			const animationMode = parseInt(animationSelect.value);
			spaceBarHint.style.display = (animationMode == 5) ? 'block' : 'none';

			if (typeof Module !== 'undefined' && Module._SetAnimationMode) {
				Module._SetAnimationMode(animationMode);
			}
		}
		animationSelect.addEventListener('change', setAnimationMode);

		characterSelect.addEventListener('change', function (e) {
			if (typeof Module !== 'undefined' && Module._SetCharacterIndex) {
				Module._SetCharacterIndex(parseInt(e.target.value, 10));
			}
		});
		speedSlider.addEventListener('input', applySpeed);

		window.addEventListener('keyup', (e) => {
			const keyCode = e.keyCode;
			if (keyCode >= 49 && keyCode <= 54) {
				speedSlider.value = keyCode - 48;
				applySpeed();
			}
		});

		const overlay = document.getElementById('dropzone');
		let dragDepth = 0;
		window.addEventListener('dragenter', function (e) {
			e.preventDefault();
			dragDepth++;
			overlay.classList.add('active');
		});
		window.addEventListener('dragover', function (e) { e.preventDefault(); });
		window.addEventListener('dragleave', function (e) {
			e.preventDefault();
			if (--dragDepth <= 0) { dragDepth = 0; overlay.classList.remove('active'); }
		});
		window.addEventListener('drop', function (e) {
			e.preventDefault();
			dragDepth = 0;
			overlay.classList.remove('active');
			const file = e.dataTransfer.files && e.dataTransfer.files[0];
			if (file) loadSpritesetFile(file);
		});

		async function loadSpritesetFile(file) {
			const bytes = new Uint8Array(await file.arrayBuffer());
			const ptr = Module._malloc(bytes.length);
			Module.HEAPU8.set(bytes, ptr);
			Module._ReloadSpritesetFromMemory(ptr, bytes.length);
			Module._free(ptr);
		}
	</script>

	{{{ SCRIPT }}}
</body>
</html>
